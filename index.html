<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JP Flash</title>
<script>
  tailwind = { config: { darkMode: 'class' } }
</script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .hidden { display: none; }
  .body-main { background-color: #ebebeb; color: #111827; }
  .dark .body-main { background-color: #151a24; color: #dfe3ed; }
  .default-input {background-color: #e3e3e3; color: #111827 border: #878787;}
  .dark .default-input {background-color: #1a212e; color: #dfe3ed; border: #dfe3ed;}
  .overlay { background-color: #f0f0f0; color: #111827; }
  .dark .overlay { background-color: #20293b; color: #dfe3ed; }
  .default-button { background-color: #ced6eb; color: #111827; }
  .dark .default-button { background-color: #374151; color: #f5f5f5; }
  .primary-button { background-color: #A855F7; color: #f5f5f5; }
  .dark .primary-button { background-color: #A855F7; color: #f5f5f5; }
  .flip-card { perspective: 1000px; width: 100%; height: 200px; }
  .flip-card-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform 0.6s; transform-style: preserve-3d;
  }
  .flip .flip-card-inner { transform: rotateY(180deg); }
  .flip-card-front, .flip-card-back {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden; border-radius: 1rem; padding: 1.5rem;
    display: flex; justify-content: center; align-items: center; flex-direction: column;
  }
  .flip-card-front { background-color: #ced6eb; color: #111827; }
  .flip-card-back { background-color: #d1ceeb; color: #111827; transform: rotateY(180deg); }
  .dark .flip-card-front { background-color: #32435c; color: white; }
  .dark .flip-card-back { background-color: #334155; color: white; }
  .lesson-complete { background-color: #86efac; color: #111827; }
  .dark .lesson-complete { background-color: #15803d; color: #f0fdf4; }

  .toggle-learned {
    border: 2px solid #22c55e;
    font-weight: 500;
    transition: background-color 0.15s, color 0.15s;
  }
  .toggle-learned.off { background-color: #f0f0f0; color: #22c55e; }
  .dark .toggle-learned.off { background-color: #20293b; color: #4ade80; border-color: #4ade80; }
  .toggle-learned.on { background-color: #22c55e; color: #f0f0f0; }
  .dark .toggle-learned.on { background-color: #4ade80; color: #20293b; border-color: #4ade80; }

  .kanji-practice-wrap { display: flex; flex-direction: column; width: 100%; height: 100%; }
  .kanji-top { flex: 1; display: flex; align-items: center; justify-content: center; }
  .kanji-bottom { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; }
  .kanji-reading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .reveal-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background-color: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    font-weight: 700; letter-spacing: 0.05em; font-size: 0.85rem;
    color: #111827;
    cursor: pointer;
  }
  .dark .reveal-overlay { background-color: rgba(0, 0, 0, 0.4); color: #f5f5f5; }
</style>
</head>
<body class="body-main min-h-screen flex items-center justify-center p-4">
  <div class="overlay p-6 rounded-xl shadow-lg w-full max-w-md text-center space-y-6">
    <div class="flex justify-between items-center">
      <button onclick="openSettings()" title="Settings">⚙️</button>
      <h1 class="text-xl font-bold"></h1>
      <div class="flex gap-2">
        <button onclick="goHome()">🏠</button>
        <button onclick="toggleDarkMode()" id="darkToggle">☀️</button>
      </div>
    </div>

    <div id="mainMenu" class="overlay space-y-4">
      <p class="text-lg font-medium">What do you want to practice?</p>
      <div class="flex flex-wrap justify-center gap-2">
        <!-- <button onclick="selectCategory('counters')" class="default-button px-4 py-2 rounded">Counters</button> -->
        <button onclick="selectCategory('kana')" class="default-button px-4 py-2 rounded">Kana</button> 
         <!-- <button onclick="selectCategory('core')" class="default-button px-4 py-2 rounded">2k Core</button> -->
        <button onclick="selectCategory('n5')" class="default-button px-4 py-2 rounded">N5</button>
        <button onclick="selectCategory('n4')" class="default-button px-4 py-2 rounded">N4</button>
        <button onclick="selectCategory('n3')" class="default-button px-4 py-2 rounded">N3</button>
        <button onclick="selectCategory('n2')" class="default-button px-4 py-2 rounded">N2</button>
        <button onclick="selectCategory('n1')" class="default-button px-4 py-2 rounded">N1</button>
      </div>
    </div>

    <div id="lessonBoard" class="hidden space-y-4">
      <p class="text-lg font-medium" id="lessonBoardTitle">Progress</p>
      <div class="w-full bg-gray-300 dark:bg-gray-700 rounded-full h-3 overflow-hidden">
        <div id="lessonProgressBar" class="h-3 bg-purple-500 transition-all" style="width: 0%"></div>
      </div>
      <p id="lessonProgressText" class="text-sm text-gray-500"></p>
      <div id="lessonGrid" class="grid grid-cols-4 gap-2"></div>
    </div>

    <div id="kanaOptions" class="hidden space-y-4">
      <p class="text-lg font-medium">Select Kana Type</p>
      <div class="flex flex-wrap justify-center gap-2">
        <button onclick="startKanaPractice('hiragana')" class="default-button px-4 py-2 rounded">Hiragana</button>
        <button onclick="startKanaPractice('katakana')" class="default-button px-4 py-2 rounded">Katakana</button>
      </div>
    </div>

    <div id="flashcardPanel" class="hidden space-y-4">
      <div id="cardProgress" class="text-sm text-gray-500"></div>
      <div class="flip-card" onclick="flipCard()">
        <div class="flip-card-inner" id="cardInner">
          <div class="flip-card-front" id="cardFront"></div>
          <div class="flip-card-back" id="cardBack"></div>
        </div>
      </div>
      <div class="flex justify-center gap-3">
        <button type="button" id="learnedToggle" onclick="toggleLearned()" class="toggle-learned off px-6 py-2 rounded">Learned</button>
        <button onclick="nextCard()" class="px-6 py-2 bg-purple-500 text-white rounded hover:bg-purple-600">Next</button>
      </div>
      <button onclick="backToLessons()" class="text-sm underline text-gray-500 hover:text-gray-700">← Back to Lessons</button>
    </div>

    <div id="kanaPanel" class="hidden space-y-4">
      <div id="kanaPrompt" class="text-4xl font-bold"></div>
      <input id="kanaAnswer" class="default-input w-full p-3 border rounded-xl" placeholder="Type romaji..." />
      <div id="kanaFeedback" class="text-base font-medium min-h-[1.5rem]"></div>
      <button onclick="submitKanaAnswer()" class="px-6 py-3 bg-blue-500 text-white rounded-xl hover:bg-blue-600 shadow">Submit</button>
    </div>
  </div>

  <div id="settingsOverlay" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4" onclick="closeSettingsOnBackdrop(event)">
    <div class="overlay p-6 rounded-xl shadow-lg w-full max-w-sm text-left space-y-5" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold">Settings</h2>
        <button onclick="closeSettings()">✕</button>
      </div>

      <div>
        <p class="font-medium mb-2">Study Direction</p>
        <div class="flex flex-col gap-2 text-sm">
          <label class="flex items-center gap-2">
            <input type="radio" name="direction" value="en-jp" onchange="updateSettings()">
            English → Japanese
          </label>
          <label class="flex items-center gap-2">
            <input type="radio" name="direction" value="jp-en" onchange="updateSettings()">
            Japanese → English
          </label>
        </div>
      </div>

      <div>
        <p class="font-medium mb-2">Japanese Text Display</p>
        <div class="flex flex-col gap-2 text-sm">
          <label class="flex items-center gap-2">
            <input type="checkbox" id="showKanji" onchange="updateSettings()">
            Kanji + Kana
          </label>
          <label class="flex items-center gap-2">
            <input type="checkbox" id="showKana" onchange="updateSettings()">
            Kana
          </label>
          <label class="flex items-center gap-2">
            <input type="checkbox" id="showRomaji" onchange="updateSettings()">
            Romaji
          </label>
        </div>
      </div>

      <div>
        <p class="font-medium mb-2">Kanji Practice Mode</p>
        <label class="flex items-center gap-2 text-sm">
          <input type="checkbox" id="kanjiPractice" onchange="updateSettings()">
          Hide reading behind a reveal button
        </label>
        <p class="text-xs text-gray-500 mt-1">Shows Kanji + Kana first; tap to reveal Kana (and Romaji, if enabled).</p>
      </div>
    </div>
  </div>

  <script>
    let cards = [], kanaList = [], current = 0, flipped = false;
    let currentCategory = "";
    let categoryWordsCache = {}; // category -> full word list with stable _idx attached
    let kanjiRevealed = false; // whether the reading has been revealed for the current card in Kanji Practice Mode

    const LESSON_SIZE = 20;
    const ALL_WORDS_FILE = {
      core: "core/2k_core.json",
      n5: "word files/n5.json",
      n4: "word files/n4.json",
      n3: "word files/n3.json",
      n2: "word files/n2.json",
      n1: "word files/n1.json"
    };

    let settings = { direction: "en-jp", showKanji: true, showKana: true, showRomaji: true, kanjiPractice: false };

    function loadSettings() {
      try {
        const raw = localStorage.getItem("jpflash_settings");
        if (raw) settings = { ...settings, ...JSON.parse(raw) };
      } catch (e) {}
    }

    function saveSettings() {
      localStorage.setItem("jpflash_settings", JSON.stringify(settings));
    }

    function openSettings() {
      document.querySelector(`input[name="direction"][value="${settings.direction}"]`).checked = true;
      document.getElementById("showKanji").checked = settings.showKanji;
      document.getElementById("showKana").checked = settings.showKana;
      document.getElementById("showRomaji").checked = settings.showRomaji;
      document.getElementById("kanjiPractice").checked = settings.kanjiPractice;
      document.getElementById("settingsOverlay").classList.remove("hidden");
    }

    function closeSettings() {
      document.getElementById("settingsOverlay").classList.add("hidden");
    }

    function closeSettingsOnBackdrop(e) {
      if (e.target.id === "settingsOverlay") closeSettings();
    }

    function updateSettings() {
      settings.direction = document.querySelector('input[name="direction"]:checked').value;
      settings.showKanji = document.getElementById("showKanji").checked;
      settings.showKana = document.getElementById("showKana").checked;
      settings.showRomaji = document.getElementById("showRomaji").checked;
      settings.kanjiPractice = document.getElementById("kanjiPractice").checked;
      saveSettings();
      kanjiRevealed = false;
      if (cards.length && !document.getElementById("flashcardPanel").classList.contains("hidden")) {
        updateCardUI(true);
      }
    }

    loadSettings();

    function toggleDarkMode() {
      document.documentElement.classList.toggle("dark");
      document.getElementById("darkToggle").textContent = document.documentElement.classList.contains("dark") ? "🌙" : "☀️";
    }

    function goHome() {
      document.getElementById("mainMenu").classList.remove("hidden");
      document.getElementById("lessonBoard").classList.add("hidden");
      document.getElementById("kanaOptions").classList.add("hidden");
      document.getElementById("flashcardPanel").classList.add("hidden");
      document.getElementById("kanaPanel").classList.add("hidden");
    }

    function selectCategory(category) {
      currentCategory = category;
      document.getElementById("mainMenu").classList.add("hidden");

      if (category === "kana") {
        document.getElementById("kanaOptions").classList.remove("hidden");
        return;
      }

      if (ALL_WORDS_FILE[category]) {
        showLessonBoard(category);
      }
    }

    function loadCategoryWords(category) {
      if (categoryWordsCache[category]) return Promise.resolve(categoryWordsCache[category]);
      return fetch(ALL_WORDS_FILE[category])
        .then(res => res.json())
        .then(data => {
          const withIndex = data.map((word, idx) => ({ ...word, _idx: idx }));
          categoryWordsCache[category] = withIndex;
          return withIndex;
        });
    }

    function getLessons(category) {
      const words = categoryWordsCache[category] || [];
      const lessons = [];
      for (let i = 0; i < words.length; i += LESSON_SIZE) {
        lessons.push(words.slice(i, i + LESSON_SIZE));
      }
      return lessons;
    }

    function getLearnedSet(category) {
      try {
        const raw = localStorage.getItem(`jpflash_learned_${category}`);
        return new Set(raw ? JSON.parse(raw) : []);
      } catch (e) {
        return new Set();
      }
    }

    function saveLearnedSet(category, set) {
      localStorage.setItem(`jpflash_learned_${category}`, JSON.stringify([...set]));
    }

    function showLessonBoard(category) {
      loadCategoryWords(category).then(() => {
        renderLessonBoard(category);
        document.getElementById("lessonBoard").classList.remove("hidden");
      });
    }

    function renderLessonBoard(category) {
      const words = categoryWordsCache[category] || [];
      const lessons = getLessons(category);
      const learned = getLearnedSet(category);

      const title = category === "core" ? "2K Core" : category.toUpperCase();
      document.getElementById("lessonBoardTitle").textContent = `${title} Progress`;

      const totalLearned = words.filter(w => learned.has(w._idx)).length;
      const pct = words.length ? Math.round((totalLearned / words.length) * 100) : 0;
      document.getElementById("lessonProgressBar").style.width = `${pct}%`;
      document.getElementById("lessonProgressText").textContent = `${totalLearned}/${words.length} words learned (${pct}%)`;

      const grid = document.getElementById("lessonGrid");
      grid.innerHTML = "";
      lessons.forEach((lesson, i) => {
        const learnedInLesson = lesson.filter(w => learned.has(w._idx)).length;
        const complete = lesson.length > 0 && learnedInLesson === lesson.length;
        const btn = document.createElement("button");
        btn.onclick = () => startLesson(category, i);
        btn.className = `p-2 rounded text-xs font-medium ${complete ? "lesson-complete" : "default-button"}`;
        btn.innerHTML = `<div>Lesson ${i + 1}</div><div>${learnedInLesson}/${lesson.length}${complete ? " ✓" : ""}</div>`;
        grid.appendChild(btn);
      });
    }

    function startLesson(category, lessonIndex) {
      currentCategory = category;
      const lessons = getLessons(category);
      const lesson = lessons[lessonIndex];
      cards = [...lesson].sort(() => Math.random() - 0.5);
      current = 0;
      flipped = false;
      kanjiRevealed = false;
      updateCardUI(true);
      document.getElementById("lessonBoard").classList.add("hidden");
      document.getElementById("flashcardPanel").classList.remove("hidden");
    }

    function setLearnedButtonState(isLearned) {
      const btn = document.getElementById("learnedToggle");
      btn.classList.toggle("on", isLearned);
      btn.classList.toggle("off", !isLearned);
    }

    function toggleLearned() {
      const v = cards[current];
      const learned = getLearnedSet(currentCategory);
      const isLearned = learned.has(v._idx);
      if (isLearned) {
        learned.delete(v._idx);
      } else {
        learned.add(v._idx);
      }
      saveLearnedSet(currentCategory, learned);
      setLearnedButtonState(!isLearned);
      updateLessonProgressLabel();
    }

    function backToLessons() {
      document.getElementById("flashcardPanel").classList.add("hidden");
      renderLessonBoard(currentCategory);
      document.getElementById("lessonBoard").classList.remove("hidden");
    }

    function updateLessonProgressLabel() {
      const learned = getLearnedSet(currentCategory);
      const learnedInLesson = cards.filter(c => learned.has(c._idx)).length;
      document.getElementById("cardProgress").textContent = `Card ${current + 1}/${cards.length} · ${learnedInLesson}/${cards.length} learned`;
    }

    function flipCard() {
      flipped = !flipped;
      updateCardUI();
    }

    function revealKanjiReading(e) {
      e.stopPropagation();
      kanjiRevealed = true;
      updateCardUI(true);
    }

    function buildJapaneseHTML(v) {
      const noDistinctKanji = !v.kanjiandkana || v.kanjiandkana === v.kana;

      // Words with no distinct kanji form (empty, or identical to the kana): just show the kana once.
      if (noDistinctKanji) {
        const parts = [];
        if ((settings.showKanji || settings.showKana) && v.kana) {
          parts.push(`<span style="font-size: 22px;">${v.kana}</span>`);
        }
        if (settings.showRomaji && v.romaji) {
          parts.push(`<span style="font-size: 11px;">${v.romaji}</span>`);
        }
        return parts.join("<br>");
      }

      const hasKanjiLine = settings.showKanji && v.kanjiandkana;
      const readingParts = [];
      if (settings.showKana && v.kana) {
        readingParts.push(`<span style="font-size: 22px;">${v.kana}</span>`);
      }
      if (settings.showRomaji && v.romaji) {
        readingParts.push(`<span style="font-size: 11px;">${v.romaji}</span>`);
      }

      const normalParts = [];
      if (hasKanjiLine) normalParts.push(`<span style="font-size: 22px;">${v.kanjiandkana}</span>`);
      normalParts.push(...readingParts);
      const normalHTML = normalParts.join("<br>");

      if (settings.kanjiPractice && hasKanjiLine && readingParts.length > 0 && !kanjiRevealed) {
        const kanjiSpan = `<span style="font-size: 22px;">${v.kanjiandkana}</span>`;
        const readingHTML = readingParts.join("<br>");
        return `
          <div class="kanji-practice-wrap">
            <div class="kanji-top">${kanjiSpan}</div>
            <div class="kanji-bottom">
              <div class="kanji-reading">${readingHTML}</div>
              <div class="reveal-overlay" onclick="revealKanjiReading(event)">REVEAL</div>
            </div>
          </div>
        `;
      }

      return normalHTML;
    }

    function updateCardUI(skipAnimation = false) {
      const inner = document.getElementById("cardInner");
      const front = document.getElementById("cardFront");
      const back = document.getElementById("cardBack");
      const v = cards[current];

      const englishHTML = v.english || "";
      const japaneseHTML = buildJapaneseHTML(v);

      if (settings.direction === "jp-en") {
        front.innerHTML = japaneseHTML;
        back.innerHTML = englishHTML;
      } else {
        front.innerHTML = englishHTML;
        back.innerHTML = japaneseHTML;
      }

      const learned = getLearnedSet(currentCategory);
      setLearnedButtonState(learned.has(v._idx));

      inner.style.transition = skipAnimation ? "none" : "";
      document.querySelector(".flip-card").classList.toggle("flip", flipped);
      if (skipAnimation) setTimeout(() => { inner.style.transition = ""; }, 20);
      updateLessonProgressLabel();
    }

    function nextCard() {
      current = (current + 1) % cards.length;
      flipped = false;
      kanjiRevealed = false;
      updateCardUI(true);
    }

    function startKanaPractice(type) {
      fetch(`kana/${type}.json`)
        .then(res => res.json())
        .then(data => {
          kanaList = data.sort(() => Math.random() - 0.5);
          current = 0;
          document.getElementById("kanaOptions").classList.add("hidden");
          document.getElementById("kanaPanel").classList.remove("hidden");
          showKanaPrompt();
          const kanaInput = document.getElementById("kanaAnswer");
          kanaInput.focus();
          scrollToPanel("kanaPanel", 120);
        });
    }

    function showKanaPrompt() {
      document.getElementById("kanaPrompt").textContent = kanaList[current].kana;
      document.getElementById("kanaAnswer").value = "";
      document.getElementById("kanaFeedback").innerHTML = "";
    }

    function submitKanaAnswer() {
      const input = document.getElementById("kanaAnswer").value.trim().toLowerCase();
      const correct = kanaList[current].romaji;
      const feedback = document.getElementById("kanaFeedback");

      if (input === correct) {
        feedback.innerHTML = "✅ Correct!";
        feedback.className = "text-green-500 font-bold";
        setTimeout(() => { current = (current + 1) % kanaList.length; showKanaPrompt(); }, 800);
      } else {
        feedback.innerHTML = `❌ Correct answer: ${correct}`;
        feedback.className = "text-red-500 font-bold";
      }
    }

    function scrollToPanel(panelId, offset = 100) {
      setTimeout(() => {
        const panel = document.getElementById(panelId);
        if (!panel) return;
        const top = panel.getBoundingClientRect().top + window.scrollY - offset;
        window.scrollTo({ top, behavior: 'smooth' });
      }, 300); // Delay to allow input focus/keyboard to settle
    }
  </script>
</body>
</html>
